{% extends 'base.html' %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width:860px">
  <div class="auth-head">
    <div class="lock-tile lt-register"><i class="bi bi-person-plus-fill"></i></div>
    <div><h2>Student Registration</h2><p>Create your hostel outpass account</p>
      <div class="chips"><span class="chip-s on">Details</span><span class="chip-s">Hostel</span><span class="chip-s">Password</span></div></div>
  </div>
  <div class="card"><div class="card-body p-4">
  <form method="post" novalidate class="row g-3">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="col-12"><div class="small fw-bold text-uppercase text-muted"><i class="bi bi-person-vcard text-primary"></i> Personal</div></div>
    <div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="name" value="{{ form.get('name','') }}" required></div>
    <div class="col-md-6"><label class="form-label">Student ID / Roll No.</label><input class="form-control" name="student_id" value="{{ form.get('student_id','') }}" placeholder="21CS001" required></div>
    <div class="col-md-6"><label class="form-label">E-mail</label><input type="email" class="form-control" name="email" value="{{ form.get('email','') }}" required></div>
    <div class="col-md-6"><label class="form-label">Phone (10 digits)</label><input class="form-control" name="phone" maxlength="10" value="{{ form.get('phone','') }}" required></div>
    <div class="col-md-6"><label class="form-label">Department</label>
      <select class="form-select" name="department" required>
        {% for d in ['Computer Science','Information Technology','Electronics','Electrical','Mechanical','Civil'] %}
        <option {{ 'selected' if form.get('department')==d }}>{{ d }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Year</label>
      <select class="form-select" name="year">{% for y in [1,2,3,4] %}<option value="{{y}}" {{ 'selected' if form.get('year')==y|string }}>{{ y }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Parent Phone</label><input class="form-control" name="parent_phone" maxlength="10" value="{{ form.get('parent_phone','') }}"></div>
    <div class="col-12 mt-3"><div class="small fw-bold text-uppercase text-muted"><i class="bi bi-building text-primary"></i> Hostel</div></div>
    <div class="col-md-6"><label class="form-label">Hostel Block</label><input class="form-control" name="hostel_block" value="{{ form.get('hostel_block','') }}" placeholder="Block A" required></div>
    <div class="col-md-6"><label class="form-label">Room No.</label><input class="form-control" name="room_no" value="{{ form.get('room_no','') }}" placeholder="A-204" required></div>
    <div class="col-12 mt-3"><div class="small fw-bold text-uppercase text-muted"><i class="bi bi-lock-fill text-primary"></i> Security</div></div>
    <div class="col-md-6"><label class="form-label">Password</label>
      <div class="input-icon"><input type="password" class="form-control" name="password" required><button type="button" class="pw-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
      <div class="form-text">Min 8 characters, letters and digits.</div></div>
    <div class="col-md-6"><label class="form-label">Confirm Password</label><input type="password" class="form-control" name="confirm_password" required></div>
    <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">
      <a class="fw-semibold small" href="{{ url_for('student_login') }}">Already registered? Login</a>
      <button class="btn btn-primary btn-lg px-5"><i class="bi bi-check2-circle"></i> Register</button></div>
  </form>
  </div></div>
</div>
{% endblock %}
